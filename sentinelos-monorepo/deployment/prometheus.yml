global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'triton-metrics'
    static_configs:
      - targets: ['triton-server:8002']

  - job_name: 'perception-service'
    static_configs:
      - targets: ['perception-service:8002']

  - job_name: 'event-runtime'
    static_configs:
      - targets: ['event-runtime:8003']
