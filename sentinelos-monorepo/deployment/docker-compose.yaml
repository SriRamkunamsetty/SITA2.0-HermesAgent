version: '3.8'

services:
  redis-broker:
    image: redis:7.0-alpine
    container_name: sentinel_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - sentinel-net

  postgres-db:
    image: postgres:15-alpine
    container_name: sentinel_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=sentinelos
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=sentinelosdbpass2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentinel-net

  neo4j-db:
    image: neo4j:5.12-community
    container_name: sentinel_neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/sentinelospassword2026
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - sentinel-net

  triton-server:
    image: nvcr.io/nvidia/tritonserver:23.08-py3
    container_name: sentinel_triton
    ports:
      - "8000:8000" # HTTP
      - "8001:8001" # gRPC
      - "8002:8002" # Metrics
    volumes:
      - ./triton_models:/models
    command: tritonserver --model-repository=/models --allow-gpu-metrics=true
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - sentinel-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.82.0
    container_name: sentinel_otel_collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # gRPC receiver
      - "8889:8889" # Prometheus exporter
    networks:
      - sentinel-net

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: sentinel_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - sentinel-net

  loki:
    image: grafana/loki:2.8.2
    container_name: sentinel_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - sentinel-net

  grafana:
    image: grafana/grafana:9.5.3
    container_name: sentinel_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - sentinel-net

  perception-service:
    build:
      context: ../services/perception
      dockerfile: Dockerfile
    container_name: sentinel_perception
    depends_on:
      - redis-broker
      - triton-server
    environment:
      - REDIS_HOST=redis-broker
      - REDIS_PORT=6379
      - TRITON_HOST=triton-server
      - TRITON_PORT=8001
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - sentinel-net

  event-runtime:
    build:
      context: ../services/event_runtime
      dockerfile: Dockerfile
    container_name: sentinel_event_runtime
    depends_on:
      - redis-broker
    environment:
      - REDIS_HOST=redis-broker
      - REDIS_PORT=6379
      - HERMES_WEBHOOK_URL=http://hermes-runtime:8644/webhook/sita-incident
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    networks:
      - sentinel-net

  hermes-runtime:
    build:
      context: ../services/hermes_coordination
      dockerfile: Dockerfile
    container_name: sentinel_hermes
    depends_on:
      - redis-broker
      - postgres-db
      - neo4j-db
    environment:
      - REDIS_HOST=redis-broker
      - REDIS_PORT=6379
      - PG_DSN=dbname=sentinelos user=postgres password=sentinelosdbpass2026 host=postgres-db
      - NEO4J_URI=bolt://neo4j-db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=sentinelospassword2026
      - WEBHOOK_PORT=8644
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    ports:
      - "8644:8644"
    networks:
      - sentinel-net

networks:
  sentinel-net:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  neo4j_data:
  neo4j_logs:
